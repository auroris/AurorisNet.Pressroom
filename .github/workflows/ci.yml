name: CI

# Tests each pull request on Windows and Linux, and merges a Dependabot update that passes. An update of a package a
# project under src references, such as Playwright, then starts the Release workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Test (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same runner images the Release workflow builds on.
          - os: windows-2025
            runtime: win-x64
          - os: ubuntu-24.04
            runtime: linux-x64
    env:
      # Cache only this workflow's dependencies, not the runner's preinstalled packages.
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # The client tests also run on .NET 8.
          dotnet-version: |
            10.0.x
            8.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
            Directory.Build.props
            build/ClientPackage.props
            NuGet.Config
            global.json

      - name: Restore dependencies
        run: dotnet restore Pressroom.slnx -p:DisableImplicitNuGetFallbackFolder=true

      - name: Build
        run: dotnet build Pressroom.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      # Real-browser tests stay off: they need the published browser payload, which the
      # Release workflow builds and tests before anything ships.
      - name: Run tests
        run: dotnet test --solution Pressroom.slnx -c Release --no-build --no-restore

  # A workflow that runs for Dependabot gets a read-only token unless the job asks for more.
  dependabot:
    name: Merge Dependabot update
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: auroris/AurorisNet.Build/actions/dependabot-release@main
